<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIFYGSA — Flujo de experiencia de usuario</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #141414; border-bottom: 1px solid #222;
    height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
  }
  #topbar .logo { display: flex; align-items: center; gap: 10px; }
  #topbar .logo span:first-child { color: #FF7420; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
  #topbar .logo span:last-child { color: #555; font-size: 13px; }
  #topbar .hint { color: #444; font-size: 12px; }

  #controls {
    position: fixed; bottom: 24px; right: 24px; z-index: 100;
    display: flex; flex-direction: column; gap: 6px;
  }
  #controls button {
    width: 36px; height: 36px; border-radius: 10px;
    background: #1a1a1a; border: 1px solid #333;
    color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  #controls button:hover { background: #2a2a2a; }

  #legend {
    position: fixed; bottom: 24px; left: 24px; z-index: 100;
    background: #141414; border: 1px solid #222; border-radius: 12px;
    padding: 14px 18px; display: flex; flex-direction: column; gap: 8px;
  }
  #legend p { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: #FF7420; margin-bottom: 2px; }
  .leg-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #888; }
  .leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  #tooltip {
    position: fixed; z-index: 200;
    background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
    padding: 14px 18px; max-width: 280px; font-size: 13px; color: #ccc;
    line-height: 1.6; pointer-events: none; display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #tooltip strong { color: #FF7420; display: block; margin-bottom: 4px; font-size: 13px; }

  #canvas { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; cursor: grab; overflow: hidden; }
  #canvas:active { cursor: grabbing; }
  #svg-wrap {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .nd { cursor: pointer; }
  .nd rect, .nd path { transition: filter 0.15s, transform 0.15s; }
  .nd:hover rect { filter: brightness(1.25); }
  .nd:hover .nd-arrow { opacity: 1; }
  .nd-arrow { opacity: 0; transition: opacity 0.2s; }

  .zone-label { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; fill: #FF7420; }
</style>
</head>
<body>

    <span>SIFYGSA</span>

<div id="tooltip"></div>

  <div class="leg-item"><div class="leg-dot" style="background:#0a2a1a;border:1px solid #1D9E75"></div> Resultado / público</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const wrap   = document.getElementById('svg-wrap');
  const tip    = document.getElementById('tooltip');
  let scale = 0.6, tx = 0, ty = 0;
  let drag = false, sx = 0, sy = 0, stx = 0, sty = 0;

  function apply() {
    wrap.style.transform = `translate(${Math.round(tx)}px,${Math.round(ty)}px) scale(${scale})`;
  }
  function clamp() {
    const sw = 1400 * scale, sh = 1100 * scale;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const margin = 200;
    tx = Math.min(margin, Math.max(cw - sw - margin, tx));
    ty = Math.min(margin, Math.max(ch - sh - margin, ty));
  }
  function init() {
    scale = Math.min(canvas.clientWidth/1500, canvas.clientHeight/1200);
    tx = (canvas.clientWidth  - 1400*scale) / 2;
    ty = (canvas.clientHeight - 1100*scale) / 2;
    apply();
  }
  init();
  window.addEventListener('resize', init);

  canvas.addEventListener('mousedown', e => {
    if (e.target.closest('.nd')) return;
    drag=true; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty;
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy);
    clamp(); apply();
  });
  window.addEventListener('mouseup', ()=>{ drag=false; });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const factor = e.deltaY > 0 ? 0.88 : 1.12;
    const newScale = Math.min(3, Math.max(0.15, scale * factor));
    // Anclar el punto bajo el cursor: el punto SVG bajo el mouse no se mueve
    tx = mx - (mx - tx) * (newScale / scale);
    ty = my - (my - ty) * (newScale / scale);
    scale = newScale;
    apply(); // sin clamp aquí para no romper el anclaje
  }, {passive:false});

  document.getElementById('zi').onclick = () => {
    scale=Math.min(3,scale*1.25);
    tx=canvas.clientWidth/2-(canvas.clientWidth/2-tx)*1.25;
    ty=canvas.clientHeight/2-(canvas.clientHeight/2-ty)*1.25;
    clamp(); apply();
  };
  document.getElementById('zo').onclick = () => {
    scale=Math.max(0.15,scale*0.8);
    tx=canvas.clientWidth/2-(canvas.clientWidth/2-tx)*0.8;
    ty=canvas.clientHeight/2-(canvas.clientHeight/2-ty)*0.8;
    clamp(); apply();
  };
  document.getElementById('zr').onclick = init;

  let tipTimeout;
  document.querySelectorAll('.nd').forEach(g => {
    g.addEventListener('click', e => {
      e.stopPropagation();
      const title = g.getAttribute('data-title');
      const text  = g.getAttribute('data-tip');
      if (!text) return;
      tip.innerHTML = `<strong>${title}</strong>${text}`;
      const rect = canvas.getBoundingClientRect();
      let tx2 = e.clientX + 16, ty2 = e.clientY - 20;
      if (tx2 + 300 > window.innerWidth) tx2 = e.clientX - 316;
      if (ty2 + 150 > window.innerHeight) ty2 = window.innerHeight - 160;
      tip.style.left  = tx2 + 'px';
      tip.style.top   = ty2 + 'px';
      tip.style.display = 'block';
      clearTimeout(tipTimeout);
      tipTimeout = setTimeout(()=>{ tip.style.display='none'; }, 6000);
    });
  });
  canvas.addEventListener('click', ()=>{ tip.style.display='none'; });
})();
</script>
</body>
